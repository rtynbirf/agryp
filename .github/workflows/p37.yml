name: p37

# Волна ×6 (2026-11-11): П37 — НАСТОЯЩИЙ ed25519 (RFC 8032) в подписанных
# конвертах + A2A AgentCard из `agrypctl card`. Приёмка issue #6 (машинная):
#   1. примитив (vendored orlp/ed25519, zlib) обязан совпадать с векторами
#      RFC 8032 §7.1 TEST 1/2/3 до последнего байта (+ перекрёстная сверка
#      с python-cryptography, когда та есть);
#   2. unit-тест «битая подпись → отказ» зелёный (tests/test_p37*.py:
#      подделка payload/unit/seq/sig/pub/key_id, чужой ключ, повтор seq,
#      легаси-wots в ed25519-дверь, мусор, отсутствие примитива — всё отказ);
#   3. карточка валидируется схемой A2A и строится из живого супервизора
#      через `agrypctl card` (= `agrypctl status --card`); endpoint живой.
# Ст. 1–2: ядро не тронуто (Поправка №12 — счёт границы); сборка из
# локальных файлов, без сети; ldd ed25519tool → только libc.

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit — ed25519-конверты: битая подпись → отказ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: сборка ядра и примитива (gcc, без сети)
        run: make agryp ed25519tool
      - name: ldd ed25519tool — только libc (Ст. 2)
        run: ldd ./ed25519tool | grep -q libc.so && ! ldd ./ed25519tool | grep -vE 'linux-vdso|libc\.so|ld-linux'
      - name: unittest — RFC 8032 + fail-closed + карточка по схеме
        run: python3 -m unittest discover -s tests -p 'test_p37*.py' -v
      - name: конституция — счёт границы клетки (Поправка №12)
        run: python3 tools/check_constitution.py
      - name: CLI самопроверка подписи + негативная проба
        run: |
          python3 tools/signed_envelope.py keygen --secret demo
          python3 tools/signed_envelope.py sign --secret demo --unit alpha \
            --payload '{"heart_rate":72}' --seq 3 --out /tmp/env.json
          python3 tools/signed_envelope.py verify /tmp/env.json
          # негативная проба: подделка конверта обязана получить ОТКАЗ
          python3 - <<'PY'
          import json, subprocess, sys
          env = json.load(open('/tmp/env.json'))
          env['env']['payload']['heart_rate'] = 666
          open('/tmp/bad.json','w').write(json.dumps(env))
          rc = subprocess.run(['python3','tools/signed_envelope.py','verify','/tmp/bad.json'],
                              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode
          sys.exit(0 if rc == 1 else 'подделка прошла проверку — fail-closed нарушен')
          PY

  live:
    name: live — завод юнита решает ed25519-подпись, карта живая
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: сборка ядра и примитива
        run: make agryp ed25519tool
      - name: демо П37 живьём (agrypctl card + ed25519-завод юнита)
        run: make demo-envelope
      - name: артефакты демо на месте
        run: |
          test -f demo/agentcard.json
          test -f demo/agentcard-status-card.json
          test -f demo/envelope-transcript.jsonl
          test -f demo/envelope-status-snapshot.jsonl
          head -c 400 demo/agentcard.json
